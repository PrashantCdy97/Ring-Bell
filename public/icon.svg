<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 12" />

  <!-- Bell mount / hanger -->
  <path d="M256 90 C238 90 224 104 224 122 L288 122 C288 104 274 90 256 90 Z" fill="#94a3b8" />
  <rect x="244" y="118" width="24" height="24" rx="4" fill="#64748b" />

  <!-- Bell body -->
  <path d="M256 138 C192 138 160 188 152 270 C146 332 120 358 112 368 C110 371 114 378 120 378 L392 378 C398 378 402 371 400 368 C392 358 366 332 360 270 C352 188 320 138 256 138 Z" fill="url(#bellGrad)" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.4))" />
  
  <!-- Bell rim highlight -->
  <ellipse cx="256" cy="378" rx="146" ry="18" fill="#f59e0b" />
  <ellipse cx="256" cy="380" rx="140" ry="14" fill="#b45309" />

  <!-- Bell Clapper / Striker -->
  <circle cx="256" cy="406" r="32" fill="url(#clapperGrad)" stroke="#78350f" stroke-width="4" />
  <circle cx="250" cy="400" r="8" fill="#fef3c7" opacity="0.8" />

  <!-- Acoustic sound waves (left and right) -->
  <path d="M96 220 C80 240 80 272 96 292" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M72 192 C46 226 46 286 72 320" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity="0.4" />
  <path d="M416 220 C432 240 432 272 416 292" fill="none" stroke="#fbbf24" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M440 192 C466 226 466 286 440 320" fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" opacity="0.4" />
</svg>
